# catalog.yaml — 模块 SSOT(认知单位,仿 Backstage catalog-info.yaml)
name: mactools
domain: dev-infra
function: 让我用脚本驱动 macOS 自动化(窗口/提醒/粘贴/文件夹等)并经 Raycast 一键触发系统级操作
public_api: mactools CLI
key_scripts: [bin/always_latest.py, bin/brew_maintain.py, bin/task_notify.py, bin/due_notify.py, bin/client_due.py, bin/weekly_reports.py, raycast/commands/create_reminder.sh]
depends_on: [dev-corelib, dockit, mailroom, llm-client, photo-app, doctools]
tier: CORE
owner: tianli
docs: ./README.md

# 运行时表面(2026-08-10 应用注册表立;对账: app_registry.py audit)
surfaces:
  - {type: launchd, id: com.tianli.always-latest}
  - {type: launchd, id: com.tianli.weekly-reports}
  - {type: launchd, id: com.tianli.monthly-reports}
  - {type: launchd, id: com.tianli.client-due}
lifecycle: active   # 2026-08-10 lint 补标(有 live 表面/显式 form 必带 lifecycle)
